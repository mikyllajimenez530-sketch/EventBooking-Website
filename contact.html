<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Eventify</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-calendar-check"></i> Eventify
    </div>

    <nav>
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
      <a href="booking.html"><i class="fa-solid fa-ticket"></i> Booking</a>
      <a href="contact.html" class="active"><i class="fa-solid fa-envelope"></i> Contact</a>
    </nav>
  </header>

  <!-- PAGE HEADER -->
  <section class="page-header">
    <h1>Contact Us</h1>
    <p>Have questions? We’re here to help!</p>
  </section>

  <!-- CONTACT SECTION -->
  <section class="contact-section">
    <div class="contact-container">

      <!-- CONTACT INFO -->
      <div class="contact-info">
        <h3>Eventify Info</h3>
        <p><i class="fa-solid fa-location-dot"></i> 123 Event Street, Manila, Philippines</p>
        <p><i class="fa-solid fa-envelope"></i> contact@eventify.com</p>
        <p><i class="fa-solid fa-phone"></i> +63 912 345 6789</p>
        <!-- Optional: Google Maps embed -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3875.123456!2d121.0000!3d14.6000!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397cabc12345678%3A0xabcdef123456!2sEventify!5e0!3m2!1sen!2sph!4v1690000000000" width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <!-- CONTACT FORM -->
      <div class="contact-form">
        <h3>Send Us a Message</h3>
        <form id="contactForm">
          <input type="text" placeholder="Your Name" id="name" required>
          <input type="email" placeholder="Your Email" id="email" required>
          <input type="text" placeholder="Subject" id="subject" required>
          <textarea placeholder="Message" id="message" rows="6" required></textarea>
          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2025 Eventify. All rights reserved.</p>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
